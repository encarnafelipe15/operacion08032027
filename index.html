<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f"><title>Operación 08·03·27 — Expediente Clasificado</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--gold:#d7b56d;--text:#edf2f7;--muted:#9caec2;--ok:#77d49a;--bad:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18314c 0,#07111f 48%,#040a12 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:32px 32px}.app{width:min(720px,100%);margin:auto;padding:18px 16px 34px;position:relative}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800}.status{font-size:10px;border:1px solid #38506b;padding:6px 9px;border-radius:999px;color:#b8c7d7}.progress{height:5px;background:#16263a;border-radius:9px;overflow:hidden;margin-bottom:28px}.progress i{display:block;height:100%;width:0;background:var(--gold);transition:.45s}.card{background:linear-gradient(145deg,rgba(16,31,50,.96),rgba(9,22,37,.96));border:1px solid #263b52;border-radius:20px;padding:28px 22px;box-shadow:0 20px 70px rgba(0,0,0,.35)}.center{text-align:center}.stamp{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:8px 13px;letter-spacing:3px;font-size:10px;font-weight:800;transform:rotate(-2deg);margin-bottom:22px}h1{font-size:clamp(30px,8vw,52px);line-height:1.02;margin:0 0 12px;letter-spacing:-1.5px}h2{font-size:28px;margin:0 0 10px}h3{font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin:0 0 18px}p{line-height:1.65;color:var(--muted);margin:10px 0}.big{font-size:19px;color:var(--text);line-height:1.5}.meta{font-family:ui-monospace,monospace;font-size:11px;color:#7890a8;margin:18px 0}.btn{border:0;border-radius:12px;background:var(--gold);color:#07111f;font-weight:900;padding:14px 20px;font-size:15px;cursor:pointer;margin-top:18px;min-width:150px}.btn.secondary{background:transparent;color:var(--gold);border:1px solid #536b83}.btn:active{transform:scale(.98)}.input{width:100%;background:#071321;border:1px solid #3a526b;color:white;border-radius:12px;padding:15px;font-size:17px;text-align:center;outline:none;margin-top:10px}.input:focus{border-color:var(--gold)}.choice{display:grid;gap:10px;margin-top:18px}.choice button{background:#0a1727;color:var(--text);border:1px solid #30465d;padding:15px;border-radius:12px;text-align:left;font-size:15px;cursor:pointer}.feedback{min-height:24px;margin-top:12px;font-size:13px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}.file{border:1px dashed #536b83;border-radius:14px;padding:16px;margin:18px 0;text-align:left;background:#091624}.file b{color:var(--gold);font-size:11px;letter-spacing:1.5px}.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}.clue{margin-top:18px;padding:14px;border-left:3px solid var(--gold);background:#091624;color:#9fb1c4;font-size:13px;text-align:left}.reveal{font-size:clamp(34px,10vw,66px);font-weight:950;letter-spacing:-2px;margin:25px 0}.count{font-size:100px;font-weight:900;color:var(--gold);line-height:1}footer{text-align:center;color:#5f7388;font-size:10px;margin-top:18px;letter-spacing:1px}.fade{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style></head><body><div class="app"><header><div class="brand">EXPEDIENTE 08·03·27</div><div class="status">CLASIFICADO</div></header><div class="progress"><i id="bar"></i></div><main id="screen"></main><footer>ACCESO PERSONAL · NO COMPARTIR LAS RESPUESTAS</footer></div>
<script>
// ===== CONFIGURACIÓN =====
// Cuando quieras poner la revelación real, cambia únicamente este texto.
const REVEAL_TEXT="¡ES UN NIÑO! 💙";
let current=0,selected="";
function render(html){document.getElementById('screen').innerHTML='<section class="card fade">'+html+'</section>';document.getElementById('bar').style.width=Math.min(current/6*100,100)+'%';}
function intro(){current=0;render(`<div class="center"><div class="stamp">TOP SECRET · SOLO PERSONAL AUTORIZADO</div><h1>OPERACIÓN<br>08·03·27</h1><p class="big">Se ha detectado una información de máxima importancia.</p><p>Para acceder al expediente definitivo tendrás que superar cinco pruebas. Todas las respuestas están escondidas en vuestra propia historia.</p><div class="meta">SUJETOS: TONI + ENCARNA<br>ESTADO: INFORMACIÓN RESERVADA</div><button class="btn" onclick="start()">INICIAR MISIÓN</button></div>`)}
function start(){level1()}
function level1(){current=1;selected="";render(`<h3>Nivel 01 · Archivo de origen</h3><h2>La primera coordenada</h2><p>Dos personas. Dos fechas. Pero hay algo curioso en sus cumpleaños…</p><div class="row"><div class="file"><b>TONI</b><p class="big">03 / 04 / 1992</p></div><div class="file"><b>ENCARNA</b><p class="big">16 / 01 / 1994</p></div></div><p class="big">Hay un número que para nosotros es especial y que seguramente vosotros también conocéis.</p><p><strong>¿Cuál es nuestro número especial?</strong></p><input id="ans" class="input" inputmode="numeric" placeholder="Código"><div id="fb" class="feedback"></div><button class="btn" onclick="check(22,level2)">VALIDAR</button><div class="clue">PISTA: no tienes que calcular nada. Piensa en <strong>nosotros</strong> y en el número que ya forma parte de nuestra historia.</div>`)}
function level2(){current=2;selected="";render(`<h3>Nivel 02 · Historial de viajes</h3><h2>Pasaporte secreto</h2><p>Hay pocas cosas que definan tanto a Toni y Encarna como las ganas de descubrir mundo. El expediente confirma que han visitado <strong>más de 55 países</strong>.</p><p>Y hay un destino especialmente importante: <strong>han estado allí 4 veces</strong>.</p><div class="file"><b>REGISTRO INTERNACIONAL</b><p>🌍 Países visitados: <strong>MÁS DE 55</strong></p><p>🏝️ Destino repetido: <strong>4 veces</strong></p><p>📍 Destino: <strong>Maldivas</strong></p></div><p>Necesitamos la <strong>cifra exacta</strong> de países que han visitado.</p><input id="ans" class="input" inputmode="numeric" placeholder="¿Cuántos países?"><div id="fb" class="feedback"></div><button class="btn" onclick="check(56,level3)">VALIDAR</button><div class="clue">PISTA: no hay que hacer una operación. Es un dato que los protagonistas de este expediente conocen muy bien.</div>`)}
function level3(){current=3;render(`<h3>Nivel 03 · Perfil de actividad</h3><h2>ADN deportivo</h2><p>Hay tres disciplinas en el archivo. Debes convertirlas en un código de tres letras.</p><div class="row"><div class="file"><b>TONI</b><p>⚽ Fútbol</p></div><div class="file"><b>ENCARNA</b><p>🏀 Baloncesto</p></div><div class="file"><b>AMBOS</b><p>🏓 Pickleball</p></div></div><p>Usa la <strong>primera letra</strong> de cada deporte, en ese orden.</p><input id="ans" class="input" autocapitalize="characters" placeholder="Código de 3 letras"><div id="fb" class="feedback"></div><button class="btn" onclick="checkText('FBP',level4)">VALIDAR</button><div class="clue">PISTA: TONI → ENCARNA → AMBOS.</div>`)}
function level4(){current=4;selected="";render(`<h3>Nivel 04 · Lista de candidatos</h3><h2>Nombres bajo vigilancia</h2><p>El departamento de inteligencia ha interceptado posibles nombres y referencias utilizadas por vuestro entorno.</p><div class="file"><b>INTERCEPCIÓN DE AMIGOS Y CÓDIGOS</b><p>“Wissam”</p><p>“Parlita Junior”</p><p>“Bermeo”</p></div><div class="file"><b>CANDIDATOS OFICIALES</b><div class="choice"><button onclick="pick('EROS',this)">A · Eros</button><button onclick="pick('ARES',this)">B · Ares</button><button onclick="pick('ATHENEA',this)">C · Athenea</button></div></div><p>Uno corresponde a una <strong>diosa</strong> de la mitología griega. ¿Cuál?</p><input id="ans" type="hidden"><div id="fb" class="feedback"></div><button class="btn" onclick="checkText('ATHENEA',level5)">VALIDAR</button><div class="clue">PISTA: dos son dioses masculinos. Una es diosa.</div>`)}
function pick(v,el){selected=v;document.querySelectorAll('.choice button').forEach(b=>b.style.borderColor='#30465d');el.style.borderColor='#d7b56d'}
function level5(){current=5;selected="";render(`<h3>Nivel 05 · Predicción final</h3><h2>La fecha clave</h2><p>El expediente contiene una fecha especialmente importante.</p><div class="file center"><b>FECHA ESTIMADA</b><div class="reveal" style="font-size:42px;color:var(--gold)">08 · 03 · 27</div></div><p>Si esta fecha señala cuándo está previsto que llegue lo que estáis esperando, ¿qué palabra lo describe mejor?</p><input id="ans" class="input" placeholder="Una palabra"><div id="fb" class="feedback"></div><button class="btn" onclick="checkText('BEBE',access)">VALIDAR</button><div class="clue">PISTA: pequeño, todavía no ha llegado y ya ha cambiado vuestra vida.</div>`)}
function check(expected,next){const v=(document.getElementById('ans').value||'').trim();const fb=document.getElementById('fb');if(v===String(expected)){fb.className='feedback ok';fb.textContent='✓ CÓDIGO CORRECTO. Expediente actualizado.';setTimeout(next,550)}else{fb.className='feedback bad';fb.textContent='✕ Código incorrecto. Revisa el expediente.'}}
function checkText(expected,next){const input=document.getElementById('ans');let v=(input && input.type!=='hidden')?(input.value||''):selected;v=v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase().replace(/\s+/g,'');const fb=document.getElementById('fb');if(v===expected){fb.className='feedback ok';fb.textContent='✓ ACCESO CONCEDIDO.';setTimeout(next,550)}else{fb.className='feedback bad';fb.textContent='✕ Esa no es la respuesta. Sigue investigando.'}}
function access(){current=6;render(`<div class="center"><div class="stamp">NIVEL 05 SUPERADO</div><h1>ACCESO<br>AUTORIZADO</h1><p class="big">Has recuperado todas las piezas del expediente.</p><p>Solo queda abrir el documento que contiene la información que no podía aparecer antes.</p><div class="meta">CLASIFICACIÓN: MÁXIMA<br>DESTINO: FAMILIA Y AMIGOS</div><button class="btn" onclick="countdown()">ABRIR EXPEDIENTE FINAL</button></div>`)}
function countdown(){current=6;let n=3;render(`<div class="center"><h3>PROTOCOLO DE APERTURA</h3><p>Preparando documento final…</p><div class="count" id="count">3</div></div>`);const t=setInterval(()=>{n--;if(n>0)document.getElementById('count').textContent=n;else{clearInterval(t);finalReveal()}},900)}
function finalReveal(){current=7;render(`<div class="center"><div class="stamp">EXPEDIENTE DESCLASIFICADO</div><h3>OPERACIÓN 08·03·27</h3><p class="meta">TONI + ENCARNA<br>FECHA ESTIMADA: 08 · 03 · 2027</p><div class="reveal">${REVEAL_TEXT}</div><p class="big">Gracias por llegar hasta el final. ❤️</p><button class="btn secondary" onclick="intro()">VOLVER A EMPEZAR</button></div>`)}
intro();
</script></body></html>
